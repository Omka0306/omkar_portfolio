<div class="relative pl-8 border-l-2 border-primary/30 pb-2">
    <div class="absolute w-4 h-4 bg-primary rounded-full -left-[9px] top-1"></div>
    <div>
      <h3 class="text-xl font-semibold">{{ title }}</h3>
      <div class="flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-4 mb-2">
        <span class="text-primary font-medium">{{ company }}</span>
        <span class="text-muted-foreground text-sm">{{ period }}</span>
      </div>
      <p class="mb-3">{{ description }}</p>
      <div class="flex flex-wrap gap-2">
        <span 
          *ngFor="let tech of technologies"
          class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full"
        >
          {{ tech }}
        </span>
      </div>
    </div>
  </div>
