<div class="bg-card rounded-lg overflow-hidden shadow-sm border hover:shadow-md transition-shadow">
    <div class="h-48 overflow-hidden">
      <img 
        [src]="image || '/assets/placeholder.svg'" 
        [alt]="title" 
        class="w-full h-full object-cover transition-transform hover:scale-105 duration-300"
      />
    </div>
    <div class="p-6">
      <h3 class="text-xl font-semibold mb-2">{{ title }}</h3>
      <p class="text-muted-foreground mb-4">{{ description }}</p>
      
      <div class="flex flex-wrap gap-2 mb-4">
        <span 
          *ngFor="let tech of technologies"
          class="text-xs px-2 py-1 bg-primary/10 text-primary rounded-full"
        >
          {{ tech }}
        </span>
      </div>
      
      <div class="flex gap-4">
        <a 
          [href]="demoUrl" 
          class="flex items-center gap-1 text-sm hover:text-primary transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" x2="21" y1="14" y2="3"></line>
          </svg> Demo
        </a>
        <a 
          [href]="codeUrl" 
          class="flex items-center gap-1 text-sm hover:text-primary transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg> Code
        </a>
      </div>
    </div>
  </div>
